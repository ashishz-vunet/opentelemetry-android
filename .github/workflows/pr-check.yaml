name: PR build

on: pull_request

permissions:
  contents: read

jobs:
  # Version fits the PR's base branch and is not on Maven Central yet (see .github/scripts/preflight.sh).
  preflight:
    name: "preflight"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Preflight script self-check
        run: bash .github/scripts/test-preflight.sh
      - name: Preflight
        run: bash .github/scripts/preflight.sh

  pr-checks:
    name: "pr-checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK for running Gradle
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle build action
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: touch local props
        run: touch demo-app/local.properties
      - name: run gradle
        run: ./gradlew check koverXmlReport --stacktrace
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          slug: open-telemetry/opentelemetry-android
      - name: build demo app
        working-directory: ./demo-app
        run: ./gradlew assembleRelease --stacktrace

  required-status-check:
    needs:
      - preflight
      - pr-checks
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: |
          needs.preflight.result != 'success' || needs.pr-checks.result != 'success'
        run: exit 1