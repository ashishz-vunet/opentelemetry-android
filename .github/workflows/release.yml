---
name: Release

# A merge into rc/* publishes x.y.z-rc.N; a merge into release/* publishes x.y.z. Both are
# permanent on Maven Central, so preflight rejects a version that is already released (every PR
# into these branches bumps `version` in gradle.properties) and one of the maven-central
# environment's reviewers approves the publish. No tags by hand: CI tags the commit it published.
on:
  push:
    branches:
      - 'rc/**'
      - 'release/**'

permissions:
  contents: read

# One release per branch at a time; a later merge waits instead of racing the Central check.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: "verify"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Version to publish
        id: version
        run: |
          version="$(.github/scripts/get-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release to publish::$version (com.vunetsystems.agent.android:agent-android-bom:$version)"
          {
            echo "### Release to publish: \`$version\`"
            echo "| Branch | Commit | BOM |"
            echo "|---|---|---|"
            echo "| \`$GITHUB_REF_NAME\` | \`${GITHUB_SHA::8}\` | \`com.vunetsystems.agent.android:agent-android-bom:$version\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight script self-check
        run: bash .github/scripts/test-preflight.sh

      - name: Preflight (version fits the branch, not on Maven Central yet)
        run: bash .github/scripts/preflight.sh

      - name: touch local props
        run: touch demo-app/local.properties

      - name: Run checks
        run: ./gradlew check --stacktrace

  publish:
    # Shown in the run graph next to the approval request.
    name: publish ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central # required reviewers approve before anything is published
    permissions:
      contents: write # for creating the tag and GitHub release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      # Again: another release may have shipped this version while this run waited for approval.
      - name: Preflight (still not on Maven Central)
        run: bash .github/scripts/preflight.sh

      - name: Build and publish artifacts
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository -Pfinal=true --no-build-cache --no-configuration-cache --no-parallel
        env:
          CI: true
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(.github/scripts/get-version.sh)
          prerelease=()
          if [[ "$version" == *-rc.* ]]; then prerelease=(--prerelease); fi
          gh release create "v$version" \
                            --target "$GITHUB_SHA" \
                            --title "Version $version" \
                            --generate-notes \
                            "${prerelease[@]}"
